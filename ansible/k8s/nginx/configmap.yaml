apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
      }
    }
