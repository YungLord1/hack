---
- name: Create dir for keys
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags:
    - k8s_install
    - k8s_prepare

- name: Update packages
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
  become: true

- name: Install base pkgs
  ansible.builtin.package:
    name: "{{ k8s_base_packages }}"
    state: present
    update_cache: false
  become: true
  tags:
    - k8s_install
    - k8s_prepare

