---
docker_gpg: https://download.docker.com/linux/ubuntu/gpg
docker_key_path: /usr/share/keyrings/docker-archive-keyring.asc
docker_repo: deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

pkgs_for_docker:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release

docker_pkgs:
          - docker-ce
          - docker-ce-cli
          - containerd.io
