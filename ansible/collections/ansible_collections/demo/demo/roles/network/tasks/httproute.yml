---
- name: Create Nginx HTTPRoute
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ nginx_kubeconfig }}"
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nginx
        namespace: demo
      spec:
        parentRefs:
          - name: nginx-gateway
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: nginx
                port: 80
